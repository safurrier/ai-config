site_name: ai-config
site_url: https://safurrier.github.io/ai-config/
site_description: Declarative plugin manager for Claude Code
site_author: Alex Furrier

repo_name: safurrier/ai-config
repo_url: https://github.com/safurrier/ai-config
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true

exclude_docs: |
  AGENTS.md

validation:
  nav:
    omitted_files: warn

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Commands: commands.md
  - Configuration: config.md
  - Conversion: conversion.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Project evolution: explanation/project-evolution.md
  - Decisions:
      - Canonical Claude source: adr/001-use-claude-plugins-as-the-canonical-source.md
      - Target-independent IR: adr/002-normalize-conversion-through-a-target-independent-ir.md
      - Native Codex packages: adr/003-use-native-codex-plugin-packages.md
      - Proven ownership: adr/004-require-proven-ownership-before-generated-output-cleanup.md
      - Plan before apply: adr/005-plan-sync-before-applying-it.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/safurrier/ai-config
